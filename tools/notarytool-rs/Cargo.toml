[package]
name = "notarytool-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Cross-platform Apple Notary API client"
repository = "https://github.com/psyche08/mihomo-app"

[dependencies]
anyhow = "=1.0.100"
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.5.48", features = ["derive", "env"] }
hex = "=0.4.3"
hmac = "=0.12.1"
p256 = { version = "=0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "=0.7.16", features = ["io"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
zeroize = "=1.8.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
